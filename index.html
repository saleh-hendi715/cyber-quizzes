<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>منصة Cyber-Saleh للاختبارات الشاملة</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-dark: #070b14;
      --card-bg: rgba(17, 25, 40, 0.78);
      --card-border: rgba(255, 255, 255, 0.08);
      --primary: #38bdf8;
      --primary-glow: rgba(56, 189, 248, 0.35);
      --accent: #818cf8;
      --success: #10b981;
      --success-bg: rgba(16, 185, 129, 0.14);
      --danger: #f43f5e;
      --danger-bg: rgba(244, 63, 94, 0.14);
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Cairo', system-ui, -apple-system, sans-serif;
    }

    body {
      background-color: var(--bg-dark);
      background-image:
        radial-gradient(circle at 15% 15%, rgba(56, 189, 248, 0.14), transparent 35%),
        radial-gradient(circle at 85% 80%, rgba(129, 140, 248, 0.14), transparent 40%);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 20px 14px 40px;
    }

    .container {
      width: 100%;
      max-width: 720px;
    }

    /* Header */
    .header {
      text-align: center;
      margin-bottom: 24px;
    }

    .badge {
      display: inline-block;
      background: linear-gradient(135deg, rgba(56, 189, 248, 0.18), rgba(129, 140, 248, 0.18));
      border: 1px solid rgba(56, 189, 248, 0.35);
      color: var(--primary);
      padding: 5px 14px;
      border-radius: 999px;
      font-size: 0.82rem;
      font-weight: 700;
      margin-bottom: 10px;
      letter-spacing: 0.4px;
    }

    .header h1 {
      font-size: 1.85rem;
      font-weight: 800;
      background: linear-gradient(135deg, #ffffff 30%, #38bdf8 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 6px;
    }

    .header p {
      color: var(--text-muted);
      font-size: 0.95rem;
    }

    /* Filter Tabs */
    .tabs-bar {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      padding-bottom: 8px;
      margin-bottom: 20px;
      scrollbar-width: none;
    }
    .tabs-bar::-webkit-scrollbar { display: none; }

    .tab-btn {
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid var(--card-border);
      color: var(--text-muted);
      padding: 8px 16px;
      border-radius: 12px;
      font-size: 0.9rem;
      font-weight: 600;
      cursor: pointer;
      white-space: nowrap;
      transition: all 0.25s ease;
    }

    .tab-btn.active, .tab-btn:hover {
      background: linear-gradient(135deg, var(--primary), var(--accent));
      color: #070b14;
      border-color: transparent;
      box-shadow: 0 4px 15px var(--primary-glow);
    }

    /* Subject Cards Grid */
    .subjects-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(210px, 1fr));
      gap: 14px;
    }

    .subject-card {
      background: var(--card-bg);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      border: 1px solid var(--card-border);
      border-radius: 18px;
      padding: 20px 18px;
      cursor: pointer;
      transition: transform 0.25s ease, border-color 0.25s ease, box-shadow 0.25s ease;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      position: relative;
      overflow: hidden;
    }

    .subject-card:hover {
      transform: translateY(-4px);
      border-color: rgba(56, 189, 248, 0.45);
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.4);
    }

    .subject-icon {
      font-size: 1.9rem;
      margin-bottom: 10px;
    }

    .subject-title {
      font-size: 1.1rem;
      font-weight: 700;
      margin-bottom: 4px;
      color: var(--text-main);
    }

    .subject-desc {
      font-size: 0.84rem;
      color: var(--text-muted);
      margin-bottom: 14px;
      line-height: 1.5;
    }

    .subject-meta {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.8rem;
      color: var(--primary);
      font-weight: 700;
      padding-top: 10px;
      border-top: 1px solid var(--card-border);
    }

    /* Glass Panel (Quiz & Result) */
    .glass-panel {
      background: var(--card-bg);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid var(--card-border);
      border-radius: 22px;
      padding: 24px 20px;
      box-shadow: 0 15px 40px rgba(0, 0, 0, 0.45);
      display: none;
    }

    .glass-panel.active {
      display: block;
      animation: fadeIn 0.3s ease;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* Quiz Top Bar */
    .quiz-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 14px;
    }

    .back-btn {
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid var(--card-border);
      color: var(--text-muted);
      padding: 6px 12px;
      border-radius: 10px;
      font-size: 0.85rem;
      cursor: pointer;
      transition: 0.2s;
    }
    .back-btn:hover { color: #fff; background: rgba(255, 255, 255, 0.12); }

    .q-counter {
      font-size: 0.9rem;
      font-weight: 700;
      color: var(--primary);
    }

    .progress-track {
      width: 100%;
      height: 7px;
      background: rgba(255, 255, 255, 0.08);
      border-radius: 999px;
      overflow: hidden;
      margin-bottom: 22px;
    }

    .progress-fill {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, var(--primary), var(--accent));
      border-radius: 999px;
      transition: width 0.35s ease;
    }

    .question-text {
      font-size: 1.15rem;
      font-weight: 700;
      line-height: 1.65;
      margin-bottom: 20px;
    }

    .question-text code {
      background: rgba(56, 189, 248, 0.14);
      color: #7dd3fc;
      padding: 2px 7px;
      border-radius: 6px;
      font-family: monospace;
      direction: ltr;
      display: inline-block;
    }

    .options-list {
      display: flex;
      flex-direction: column;
      gap: 11px;
    }

    .option-btn {
      width: 100%;
      text-align: right;
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid var(--card-border);
      color: var(--text-main);
      padding: 14px 16px;
      border-radius: 14px;
      font-size: 0.98rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .option-btn:hover:not(:disabled) {
      background: rgba(56, 189, 248, 0.1);
      border-color: rgba(56, 189, 248, 0.45);
    }

    .option-btn.correct {
      background: var(--success-bg);
      border-color: var(--success);
      color: #6ee7b7;
    }

    .option-btn.wrong {
      background: var(--danger-bg);
      border-color: var(--danger);
      color: #fda4af;
    }

    .explanation-box {
      margin-top: 18px;
      padding: 14px 16px;
      border-radius: 14px;
      background: rgba(56, 189, 248, 0.08);
      border-right: 4px solid var(--primary);
      font-size: 0.92rem;
      line-height: 1.6;
      color: #e2e8f0;
      display: none;
    }

    .primary-btn {
      width: 100%;
      margin-top: 20px;
      padding: 13px;
      border: none;
      border-radius: 14px;
      background: linear-gradient(135deg, var(--primary), var(--accent));
      color: #070b14;
      font-size: 1rem;
      font-weight: 800;
      cursor: pointer;
      box-shadow: 0 6px 20px var(--primary-glow);
      transition: transform 0.2s ease;
    }

    .primary-btn:hover { transform: translateY(-2px); }

    /* Result Screen */
    .result-header {
      text-align: center;
      margin-bottom: 20px;
    }

    .score-circle {
      width: 110px;
      height: 110px;
      border-radius: 50%;
      margin: 0 auto 14px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, rgba(56, 189, 248, 0.15), rgba(129, 140, 248, 0.15));
      border: 3px solid var(--primary);
      box-shadow: 0 0 25px var(--primary-glow);
    }

    .score-circle span {
      font-size: 1.7rem;
      font-weight: 800;
      color: #fff;
    }

    .stats-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin-bottom: 20px;
    }

    .stat-card {
      padding: 14px;
      border-radius: 14px;
      text-align: center;
      border: 1px solid var(--card-border);
    }

    .stat-card.good { background: var(--success-bg); border-color: rgba(16, 185, 129, 0.35); }
    .stat-card.bad { background: var(--danger-bg); border-color: rgba(244, 63, 94, 0.35); }

    .stat-num { font-size: 1.5rem; font-weight: 800; display: block; }
    .stat-card.good .stat-num { color: #34d399; }
    .stat-card.bad .stat-num { color: #fb7185; }

    .review-list {
      display: flex;
      flex-direction: column;
      gap: 12px;
      margin-top: 16px;
    }

    .review-item {
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid var(--card-border);
      border-radius: 14px;
      padding: 14px;
      font-size: 0.9rem;
      line-height: 1.6;
    }

    .review-item.is-correct { border-right: 4px solid var(--success); }
    .review-item.is-wrong { border-right: 4px solid var(--danger); }

    .action-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-top: 20px;
    }

    .secondary-btn {
      padding: 13px;
      border-radius: 14px;
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid var(--card-border);
      color: #fff;
      font-size: 0.95rem;
      font-weight: 700;
      cursor: pointer;
    }

    footer {
      margin-top: 32px;
      text-align: center;
      color: var(--text-muted);
      font-size: 0.85rem;
    }
    footer strong { color: var(--primary); }
  </style>
</head>
<body>

  <div class="container">
    <!-- Header -->
    <div class="header">
      <div class="badge">منصة الاختبارات التفاعلية</div>
      <h1>منصة Cyber-Saleh التعليمية</h1>
      <p>اختر المادة التي تريد مراجعتها وابدأ الاختبار مع تصحيح فوري وشرح لكل سؤال</p>
    </div>

    <!-- Home Screen -->
    <div id="home-screen">
      <div class="tabs-bar" id="tabs-bar">
        <button class="tab-btn active" onclick="filterSubjects('all', this)">الكل</button>
        <button class="tab-btn" onclick="filterSubjects('programming', this)">البرمجة</button>
        <button class="tab-btn" onclick="filterSubjects('math', this)">الرياضيات والمنطق</button>
        <button class="tab-btn" onclick="filterSubjects('general', this)">المواد العامة</button>
      </div>
      <div class="subjects-grid" id="subjects-grid"></div>
    </div>

    <!-- Quiz Screen -->
    <div id="quiz-screen" class="glass-panel">
      <div class="quiz-top">
        <button class="back-btn" onclick="goHome()">← العودة للمواد</button>
        <span class="q-counter" id="q-counter">سؤال 1 من 4</span>
      </div>
      <div class="progress-track">
        <div class="progress-fill" id="progress-fill"></div>
      </div>
      <div class="question-text" id="question-text"></div>
      <div class="options-list" id="options-list"></div>
      <div class="explanation-box" id="explanation-box"></div>
      <button class="primary-btn" id="next-btn" style="display:none;" onclick="nextQuestion()">السؤال التالي</button>
    </div>

    <!-- Result Screen -->
    <div id="result-screen" class="glass-panel">
      <div class="result-header">
        <div class="score-circle">
          <span id="score-percent">0%</span>
        </div>
        <h2 id="result-title">انتهى الاختبار!</h2>
        <p style="color: var(--text-muted); font-size: 0.9rem;" id="result-subject"></p>
      </div>

      <div class="stats-row">
        <div class="stat-card good">
          <span class="stat-num" id="correct-count">0</span>
          إجابات صحيحة
        </div>
        <div class="stat-card bad">
          <span class="stat-num" id="wrong-count">0</span>
          إجابات خاطئة
        </div>
      </div>

      <div class="review-list" id="review-list"></div>

      <div class="action-row">
        <button class="primary-btn" style="margin-top:0;" onclick="retryQuiz()">إعادة الاختبار</button>
        <button class="secondary-btn" onclick="goHome()">اختيار مادة أخرى</button>
      </div>
    </div>

    <footer>
      إعداد وتصميم: <strong>Cyber-Saleh</strong> © 2026
    </footer>
  </div>

  <script>
    // ==========================================
    // قاعدة بيانات المواد والأسئلة (سهلة التعديل والإضافة)
    // ==========================================
    const subjectsData = [
      {
        id: "cpp",
        category: "programming",
        icon: "💻",
        title: "برمجة ++C",
        desc: "الدوال التي ينشئها المستخدم، دوال void، والمعاملات.",
        questions: [
          {
            q: "ما هي الوظيفة الأساسية للكلمة المفتاحية <code>void</code> عند تعريف دالة في ++C؟",
            options: [
              "تعني أن الدالة لا تُرجع أي قيمة بعد انتهاء تنفيذها",
              "تعني أن الدالة تُرجع قيمة عددية صحيحة دائماً",
              "تُستخدم لمنع استدعاء الدالة داخل main",
              "تعني أن الدالة تقبل نصاً فقط كمعامل"
            ],
            answer: 0,
            explanation: "النوع void يعني (فارغ)، ويُستخدم للدوال التي تنفذ مهمة معينة مثل الطباعة ولا تُرجع قيمة باستخدام return."
          },
          {
            q: "إذا عرّفنا دالة بالشكل <code>void greet()</code>، فما هو نوعها بين الأنواع الأربعة للدوال؟",
            options: [
              "تُرجع قيمة وتستقبل معاملات",
              "لا تُرجع قيمة ولا تستقبل معاملات",
              "لا تُرجع قيمة وتستقبل معاملات",
              "تُرجع قيمة ولا تستقبل معاملات"
            ],
            answer: 1,
            explanation: "لأن نوعها void فهي لا تُرجع قيمة، ولأن الأقواس () فارغة فهي لا تستقبل أي معاملات (Parameters)."
          },
          {
            q: "أي من العبارات التالية صحيحة عند استدعاء دالة <code>void</code> داخل <code>main()</code>؟",
            options: [
              "يمكن طباعتها مباشرة داخل cout << myFunc();",
              "يمكن تخزين ناتجها داخل متغير int x = myFunc();",
              "تُستدعى كجملة مستقلة باسمها وأقواسها فقط مثل myFunc();",
              "يجب وضع كلمة void قبل اسمها عند كل استدعاء"
            ],
            answer: 2,
            explanation: "بما أن دالة void لا تُرجع قيمة، فلا يمكن طباعتها بـ cout أو تخزينها في متغير، بل تُستدعى مباشرة كسطر مستقل."
          }
        ]
      },
      {
        id: "discrete",
        category: "math",
        icon: "📐",
        title: "الرياضيات المتقطعة",
        desc: "المجموعات، العمليات عليها، والمنطق الرياضي.",
        questions: [
          {
            q: "إذا كانت المجموعة A = {1, 2, 3} والمجموعة B = {3, 4, 5}، فما هو ناتج التقاطع (A ∩ B)؟",
            options: ["{1, 2, 3, 4, 5}", "{3}", "{1, 2}", "∅ (المجموعة الخالية)"],
            answer: 1,
            explanation: "التقاطع (∩) يأخذ العناصر المشتركة فقط بين المجموعتين، والعنصر المشترك الوحيد هنا هو 3."
          },
          {
            q: "في المنطق الرياضي، متى تكون العبارة الشرطية (P → Q) خاطئة (False)؟",
            options: [
              "عندما تكون P خاطئة و Q خاطئة",
              "عندما تكون P خاطئة و Q صحيحة",
              "عندما تكون P صحيحة و Q خاطئة",
              "عندما تكون P صحيحة و Q صحيحة"
            ],
            answer: 2,
            explanation: "العبارة الشرطية (إذا كان P فإن Q) تكون خاطئة في حالة واحدة فقط: عندما تكون المقدمة P صحيحة والنتيجة Q خاطئة."
          }
        ]
      },
      {
        id: "logic",
        category: "math",
        icon: "⚡",
        title: "الدوائر المنطقية",
        desc: "البوابات المنطقية، الجبر البولياني، والأنظمة العددية.",
        questions: [
          {
            q: "أي بوابة منطقية تعطي مخرجاً (1) فقط عندما تكون جميع مدخلاتها (1)؟",
            options: ["بوابة OR", "بوابة AND", "بوابة XOR", "بوابة NOT"],
            answer: 1,
            explanation: "بوابة AND تعمل مثل الضرب المنطقي، فلا تعطي 1 إلا إذا كانت كل المدخلات تساوي 1."
          },
          {
            q: "ما هو المكافئ العشري للعدد الثنائي <code>1010</code>؟",
            options: ["8", "10", "12", "14"],
            answer: 1,
            explanation: "بحساب الأوزان: (1×8) + (0×4) + (1×2) + (0×1) = 8 + 2 = 10."
          }
        ]
      },
      {
        id: "english",
        category: "general",
        icon: "🌐",
        title: "اللغة الإنجليزية التقنية",
        desc: "قواعد اللغة الإنجليزية ومصطلحات الحاسوب والأمن السيبراني.",
        questions: [
          {
            q: "Choose the correct verb: She ____ studying cybersecurity at university.",
            options: ["am", "is", "are", "be"],
            answer: 1,
            explanation: "الضمير المفرد (She) يأخذ الفعل المساعد (is) في زمن المضارع المستمر."
          },
          {
            q: "What does 'Firewall' primarily do in a computer network?",
            options: [
              "Increases CPU speed",
              "Monitors and filters incoming and outgoing network traffic",
              "Stores backup files permanently",
              "Compiles C++ source code"
            ],
            answer: 1,
            explanation: "جدار الحماية (Firewall) وظيفته مراقبة وتصفية حركة البيانات الداخلة والخارجة لحماية الشبكة."
          }
        ]
      },
      {
        id: "skills",
        category: "general",
        icon: "🖥️",
        title: "مهارات الحاسوب",
        desc: "مكونات الحاسوب، أنظمة التشغيل، وبرامج الأوفيس.",
        questions: [
          {
            q: "أي من الذاكرات التالية تُفقد بياناتها بمجرد انقطاع التيار الكهربائي عن الحاسوب؟",
            options: ["القرص الصلب (HDD/SSD)", "ذاكرة القراءة فقط (ROM)", "الذاكرة العشوائية (RAM)", "وحدة التخزين الفلاشية (USB)"],
            answer: 2,
            explanation: "ذاكرة الوصول العشوائي (RAM) هي ذاكرة متطايرة (Volatile) تحتفظ بالبيانات مؤقتاً أثناء تشغيل الجهاز فقط."
          },
          {
            q: "في برنامج Microsoft Excel، بأي رمز يجب أن تبدأ أي معادلة حسابية؟",
            options: ["#", "@", "=", "$"],
            answer: 2,
            explanation: "في Excel، تبدأ جميع الصيغ والدوال الحسابية بعلامة المساواة (=) مثل =SUM(A1:A5)."
          }
        ]
      }
    ];

    let currentSubject = null;
    let currentIndex = 0;
    let score = 0;
    let userAnswers = [];

    const homeScreen = document.getElementById("home-screen");
    const quizScreen = document.getElementById("quiz-screen");
    const resultScreen = document.getElementById("result-screen");
    const subjectsGrid = document.getElementById("subjects-grid");

    function renderSubjects(filter = "all") {
      subjectsGrid.innerHTML = "";
      const filtered = filter === "all"
        ? subjectsData
        : subjectsData.filter(s => s.category === filter);

      filtered.forEach(sub => {
        const card = document.createElement("div");
        card.className = "subject-card";
        card.onclick = () => startQuiz(sub.id);
        card.innerHTML = `
          <div>
            <div class="subject-icon">${sub.icon}</div>
            <div class="subject-title">${sub.title}</div>
            <div class="subject-desc">${sub.desc}</div>
          </div>
          <div class="subject-meta">
            <span>${sub.questions.length} أسئلة</span>
            <span>ابدأ الآن ←</span>
          </div>
        `;
